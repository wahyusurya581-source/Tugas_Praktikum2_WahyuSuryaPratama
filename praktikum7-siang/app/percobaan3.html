<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 id="judul">selamat datang</h2>
    <button id="btnUbah">ubah tampilan</button>

    <script>
        function ubahTampilan() {
            const judul = document.getElementById("judul");
            judul.textContent ="belajar dom js asikk uyyy"
            judul.style.color ="blue";
        }

        document.getElementById("btnUbah")
        .addEventListener("click", ubahTampilan)
    </script>
</body>
</html>
