<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <h1>Form Pemesanan Pizza</h1>
    <p>Silahkan isi form dibawah ini untuk memesan Pizza</p>

    <form action="hasil.html" method="get">
        <fieldset>
            <legend>Informasi Pemesan</legend>
            <p>
                <label for="costumername">Name:</label>
                <input type="text" name="costumername" id="costumername" required />
            </p>
                
            <p>
                <label for="address">Address:</label>
                <input type="text" name="address" id="address" required />
            </p>

            <p>
                <label for="telephone">Phone:</label>
                <input type="text" name="telephone" id="telephone" required />
            </p>

            <p>
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" required />
            </p>

            <p>
                <label for="intruction">Delivery Instruction:</label><br>
                <textarea
                    name="intruction"
                    id="intruction"
                    rows="4"
                    cols="50"
                    maxlength="400"
                    placeholder="No more than 400 characters"></textarea>
            </p>
        </fieldset>

        <fieldset>
            <legend>Design Your Dream Pizza</legend>
            <p><strong>Pizza Specs</strong></p>
            <p>Pilih Salah Satu</p>

            <p>
                <input type="radio" name="crust" id="classic" value="classic white" required />
                <label for="classic">Classic White</label><br>

                <input type="radio" name="crust" id="paperoni" value="paperoni" required />
                <label for="classic">Paperoni</label><br>

                <input type="radio" name="crust" id="ayam" value="ayam" required />
                <label for="classic">Ayam</label><br>

                <input type="radio" name="crust" id="classic" value="classic white" required />
                <label for="classic">Classic White</label>
            </p>

            <p><strong>Toppings</strong></p>

            <p>
                <input type="checkbox" name="toppings" id="red-sauce" value="red-sauce" />
                <label for="red-sauce">Red Sauce</label><br>

                <input type="checkbox" name="toppings" id="white-sauce" value="white-sauce" />
                <label for="white-sauce">White Sauce</label><br>

                <input type="checkbox" name="toppings" id="mozzarella" value="mozzarella" />
                <label for="mozzarella">Mozzarella Cheese</label><br>

                <input type="checkbox" name="toppings" id="cheese" value="cheese" />
                <label for="cheese">Cheese</label><br>
            </p>
            <p>
                <label for="quantity">Quantity:</label>
                <select name="quantity" id="quantity">
                    <option value="">Pilih Jumlah</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </p>
        </fieldset>

          <p>
            <input type="submit" value="Submit" />
            <input type="reset" value="Reset" />
        </p>
    </form>
  </body>
</html>
